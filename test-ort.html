<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico ONNX Runtime</title>
<style>
body{font-family:monospace;background:#0a0e1a;color:#c8e6c9;padding:16px;font-size:13px;line-height:1.6}
.ok{color:#6bcb6b}.err{color:#ff6b6b}.warn{color:#ffd93d}.info{color:#6bcaff}
h1{color:#f5c518;font-size:18px}
</style>
</head>
<body>
<h1>🔍 Diagnóstico ONNX Runtime</h1>
<div id="out">Ejecutando pruebas…</div>
<script>
const out = document.getElementById('out');
const log = (msg, cls='') => { out.innerHTML += `<div class="${cls}">${msg}</div>`; };

async function run() {
  out.innerHTML = '';

  // 1. ¿Modo aislado?
  log(`crossOriginIsolated: ${self.crossOriginIsolated}`, self.crossOriginIsolated ? 'ok' : 'warn');
  if (!self.crossOriginIsolated) {
    log('⚠️ NO aislado → las cabeceras COOP/COEP no se aplicaron. Sin multi-hilo.', 'warn');
  } else {
    log('✓ Aislado → multi-hilo disponible', 'ok');
  }

  // 2. ¿Los archivos vendor son accesibles?
  const files = [
    './vendor/ort/ort.min.js',
    './vendor/ort/ort-wasm-simd-threaded.wasm',
    './vendor/ort/ort-wasm-simd-threaded.mjs',
    './vendor/ort/ort-wasm-simd.wasm',  // el de single-thread (puede faltar)
    './models/model_detector.onnx',
    './models/model.onnx',
  ];
  for (const f of files) {
    try {
      const r = await fetch(f, { method: 'HEAD' });
      const size = r.headers.get('content-length');
      const mb = size ? (size/1024/1024).toFixed(1)+'MB' : '?';
      log(`${r.ok?'✓':'✗'} ${f} → ${r.status} (${mb})`, r.ok ? 'ok' : 'err');
    } catch(e) {
      log(`✗ ${f} → ERROR: ${e.message}`, 'err');
    }
  }

  // 3. ¿Carga ONNX Runtime?
  log('Cargando ONNX Runtime…', 'info');
  try {
    const script = document.createElement('script');
    script.src = './vendor/ort/ort.min.js';
    await new Promise((res, rej) => { script.onload = res; script.onerror = () => rej(new Error('script onerror')); document.head.appendChild(script); });
    if (window.ort) {
      log('✓ ONNX Runtime cargado', 'ok');
      window.ort.env.wasm.wasmPaths = './vendor/ort/';
      window.ort.env.wasm.numThreads = self.crossOriginIsolated ? 2 : 1;
      log(`numThreads = ${window.ort.env.wasm.numThreads}`, 'info');

      // 4. ¿Carga el modelo?
      log('Cargando model_detector.onnx…', 'info');
      try {
        const sess = await window.ort.InferenceSession.create('./models/model_detector.onnx', { executionProviders: ['wasm'] });
        log('✓✓✓ MODELO CARGADO CORRECTAMENTE', 'ok');
        log(`Entradas: ${sess.inputNames}, Salidas: ${sess.outputNames}`, 'ok');
      } catch(e) {
        log(`✗ Error cargando modelo: ${e.message || e}`, 'err');
        log(`Detalle: ${JSON.stringify(e)}`, 'err');
      }
    } else {
      log('✗ window.ort no existe tras cargar el script', 'err');
    }
  } catch(e) {
    log(`✗ Error cargando ONNX Runtime: ${e.message}`, 'err');
  }
}
run();
</script>
</body>
</html>
